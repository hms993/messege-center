<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>موقعي الشخصي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .card {
            background: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 100%;
        }
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: #007bff;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 48px;
            font-weight: bold;
        }
        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 10px;
        }
        p {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 25px;
            line-height: 1.6;
        }
        .links a {
            display: block;
            background-color: #24292e;
            color: white;
            text-decoration: none;
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            font-weight: bold;
            transition: background 0.3s ease;
        }
        .links a:hover {
            background-color: #007bff;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="profile-img">👋</div>
        <h1>مرحباً بك في موقعي الجديد!</h1>
        <p>هذه الصفحة تم إنشاؤها ورفعها بنجاح باستخدام GitHub Pages. يمكنك تعديل هذا النص وكتابة نبذة عنك أو عن مشروعك.</p>
        
        <div class="links">
            <a href="https://github.com" target="_blank">حسابي على GitHub</a>
            <a href="#" onclick="alert('أضف رابط حسابك هنا!')">تواصل معي</a>
        </div>
    </div>

</body>
</html>
